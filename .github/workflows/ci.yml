name: CI/CD Pipeline

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

jobs:
  test:
    name: Test Services
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: pharmauser
          POSTGRES_PASSWORD: pharmapass
          POSTGRES_DB: pharmaverify_test
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432

      redis:
        image: redis:7
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 6379:6379

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run database migrations
        env:
          DATABASE_URL: postgresql://pharmauser:pharmapass@localhost:5432/pharmaverify_test
        run: node scripts/migrate.js

      - name: Run tests
        env:
          DATABASE_URL: postgresql://pharmauser:pharmapass@localhost:5432/pharmaverify_test
          REDIS_HOST: localhost
          REDIS_PORT: 6379
          JWT_SECRET: test-secret-key
        run: npm test

      - name: Lint code
        run: npm run lint

  build:
    name: Build Docker Images
    runs-on: ubuntu-latest
    needs: test
    if: github.event_name == 'push'

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push backend image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: infrastructure/docker/Dockerfile.backend
          push: true
          tags: ghcr.io/${{ github.repository }}/backend:${{ github.sha }}

      - name: Build and push frontend image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: infrastructure/docker/Dockerfile.frontend
          push: true
          tags: ghcr.io/${{ github.repository }}/frontend:${{ github.sha }}

      - name: Build and push AI service image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: infrastructure/docker/Dockerfile.python
          push: true
          tags: ghcr.io/${{ github.repository }}/ai-service:${{ github.sha }}

  deploy-staging:
    name: Deploy to Staging
    runs-on: ubuntu-latest
    needs: build
    if: github.ref == 'refs/heads/develop'
    environment: staging

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup kubectl
        uses: azure/setup-kubectl@v3

      - name: Configure kubectl
        run: |
          echo "${{ secrets.KUBECONFIG_STAGING }}" | base64 -d > kubeconfig
          export KUBECONFIG=kubeconfig

      - name: Deploy to Kubernetes
        run: |
          kubectl set image deployment/api-gateway api-gateway=ghcr.io/${{ github.repository }}/backend:${{ github.sha }} -n pharma-verify-staging
          kubectl set image deployment/verification-service verification-service=ghcr.io/${{ github.repository }}/backend:${{ github.sha }} -n pharma-verify-staging
          kubectl set image deployment/auth-service auth-service=ghcr.io/${{ github.repository }}/backend:${{ github.sha }} -n pharma-verify-staging
          kubectl set image deployment/batch-service batch-service=ghcr.io/${{ github.repository }}/backend:${{ github.sha }} -n pharma-verify-staging
          kubectl set image deployment/notification-service notification-service=ghcr.io/${{ github.repository }}/backend:${{ github.sha }} -n pharma-verify-staging
          kubectl rollout status deployment -n pharma-verify-staging

  deploy-production:
    name: Deploy to Production
    runs-on: ubuntu-latest
    needs: build
    if: github.ref == 'refs/heads/main'
    environment: production

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup kubectl
        uses: azure/setup-kubectl@v3

      - name: Configure kubectl
        run: |
          echo "${{ secrets.KUBECONFIG_PRODUCTION }}" | base64 -d > kubeconfig
          export KUBECONFIG=kubeconfig

      - name: Deploy to Kubernetes
        run: |
          kubectl set image deployment/api-gateway api-gateway=ghcr.io/${{ github.repository }}/backend:${{ github.sha }} -n pharma-verify-prod
          kubectl set image deployment/verification-service verification-service=ghcr.io/${{ github.repository }}/backend:${{ github.sha }} -n pharma-verify-prod
          kubectl set image deployment/auth-service auth-service=ghcr.io/${{ github.repository }}/backend:${{ github.sha }} -n pharma-verify-prod
          kubectl set image deployment/batch-service batch-service=ghcr.io/${{ github.repository }}/backend:${{ github.sha }} -n pharma-verify-prod
          kubectl set image deployment/notification-service notification-service=ghcr.io/${{ github.repository }}/backend:${{ github.sha }} -n pharma-verify-prod
          kubectl rollout status deployment -n pharma-verify-prod

      - name: Run smoke tests
        run: |
          curl -f https://api.pharmaverify.com/health || exit 1
